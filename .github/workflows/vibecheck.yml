# VibeCheck scanning itself.
#
# This is the live workflow for THIS repository — not the copy-paste template.
# The template lives in ci/github-actions.yml and uses readable version tags;
# this file pins every action to a commit SHA, because VibeCheck reports mutable
# action tags as a finding and a security tool should not exempt itself.
#
# Refresh the pins with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> -q .object.sha
name: VibeCheck Security

on:
  push:
    branches: [main]        # PR runs cover branches; avoids double-running
  pull_request:
  workflow_dispatch:        # manual run

permissions:
  contents: read
  security-events: write    # required to upload SARIF to Code Scanning

jobs:
  vibecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0    # full history for secret scanning

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pipx install semgrep

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567   # v0.3.1

      - name: Install jq
        # Hard requirement: VibeCheck parses all scanner output as JSON.
        # Present on ubuntu-latest today; installed explicitly so a runner image
        # change cannot turn this into a confusing mid-scan failure.
        run: jq --version || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

      - name: Install gitleaks (pinned release, download-to-file)
        run: |
          v=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Exit codes: 0 clean · 1 findings at/above threshold · 2 usage error
      #             3 a pass could not complete (fail-closed)
      #
      # --semgrep-config p/ci is pinned deliberately: `auto` resolves rulesets
      # from the registry per-run, so a registry change could alter results (or,
      # under fail-closed, redden the build) without a commit here.
      #
      # --skip-deps is explicit and recorded in the report: this repo is a bash
      # script with no dependency manifest, so there is nothing to resolve. It is
      # a stated decision rather than a silent gap.
      - name: Run VibeCheck on itself
        run: ./vibecheck.sh --fail-on high --semgrep-config p/ci --skip-deps

      # Uploaded even when the gate fails, so findings reach the Security tab.
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b   # v3
        if: always()
        with:
          sarif_file: vibecheck-report/vibecheck.sarif
          category: vibecheck

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        if: always()
        with:
          name: vibecheck-report
          path: vibecheck-report/
