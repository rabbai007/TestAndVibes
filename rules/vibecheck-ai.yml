          - pattern: $C->chat()->create(...)
          - pattern: $C->completions()->create(...)
          - pattern: $C->messages()->create(...)
          - pattern: $C->responses()->create(...)
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: eval(...)
          - pattern: $PDO->query(...)
