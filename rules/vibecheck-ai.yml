  - id: vibecheck-llm-output-raw-html-php
    languages: [php]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "LLM05:2025 Improper Output Handling"
    message: >-
      LLM output is echoed into the page as raw HTML. A prompt-injected model can
      return markup or <script>; encode it (htmlspecialchars) before output.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $C->chat()->create(...)
          - pattern: $C->completions()->create(...)
          - pattern: $C->messages()->create(...)
          - pattern: $C->responses()->create(...)
    pattern-sinks:
      - pattern-either:
          - pattern: echo $SINK;
          - pattern: print $SINK;
    pattern-sanitizers:
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
