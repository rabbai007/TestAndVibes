          - pattern: "['role' => 'system', 'content' => $A . $REQ]"
      - metavariable-pattern:
          metavariable: $REQ
          patterns:
            - pattern-either:
                - pattern: $_GET[...]
                - pattern: $_POST[...]
                - pattern: $_REQUEST[...]
                - pattern: $_COOKIE[...]

  - id: vibecheck-llm-output-executed-php
    languages: [php]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code (Code Injection)"
      owasp: "LLM05:2025 Improper Output Handling"
    message: >-
      LLM output flows into a shell / SQL / eval sink without validation. Model
      output is untrusted; validate or allowlist before it becomes an action.
    mode: taint
